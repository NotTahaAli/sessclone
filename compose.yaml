# Ticket 67: the whole thing, against your own database and your own bucket.
#
#   cp .env.example .env    # then fill it in, see docs/self-hosting.md
#   docker compose up --build
#
# What this file deliberately does not run: storage and authentication. Both
# are the deployment's own (an S3-compatible bucket, and a Supabase project —
# hosted or self-hosted) because both hold data that must outlive a container,
# and a compose file that quietly stood up a bucket would be a compose file
# that quietly lost the transcripts in it.
#
# Postgres is here under a profile, for a deployment that has no cluster yet:
#
#   docker compose --profile db up --build
#
# Without that profile nothing is started but the application, and
# DATABASE_URL points wherever you already keep your data.

services:
  web:
    build:
      context: .
      args:
        # Read by the browser bundle, so they are build arguments as well as
        # environment: changing them means rebuilding the image.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    # Every value comes from the environment file rather than from this file:
    # a compose file in a repository is a compose file in a pull request.
    env_file: .env
    ports:
      - '${PORT:-3000}:3000'
    restart: unless-stopped

  # A cluster for a deployment that has none. Two roles, because they are
  # deliberately two: the migrating owner, and the unprivileged role the
  # dashboard reads as. `supabase/README.md` explains why, and why pointing
  # DATABASE_URL at the owner switches row-level security off silently.
  db:
    profiles: ['db']
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_USER: sessclone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sessclone
    # Named, so `docker compose down` does not take the database with it.
    volumes:
      - sessclone-db:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sessclone -d sessclone']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  sessclone-db:
