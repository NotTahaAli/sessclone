# Versions here are pinned exactly, most of them once in the `catalog:` of
# pnpm-workspace.yaml. Dependabot updates pnpm catalogs (GA 2025-02-04), so the
# npm entry at the root covers the catalog and every workspace package.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']

  # The Node image must match `.nvmrc` and `engines` in package.json, which
  # Dependabot does not touch: a PR that bumps it needs those two (and
  # ticket-graph.yml) edited to match before merge. Majors are done by hand.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
